<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="台股雷達"><meta name="theme-color" content="#0a1021"><title>台股短線雷達</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#0a1021;color:#ebf3ff}*{box-sizing:border-box}body{margin:0}header{padding:30px 18px 15px;background:linear-gradient(140deg,#142d50,#0a1021)}h1{font-size:26px;margin:0 0 6px}.subtitle,.muted{color:#8ea5c1;font-size:13px}.wrap{max-width:900px;margin:auto;padding:0 14px 70px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.stat,.panel{background:#131f35;border:1px solid #263852;border-radius:14px;padding:14px}.stat strong{display:block;font-size:21px;margin-top:7px}.stat span{font-size:12px;color:#9badc6}input,select,button{font:inherit;border-radius:10px;padding:11px;background:#172741;color:#f4f8ff;border:1px solid #344b69}button{cursor:pointer;background:#215899;border-color:#3571bb}input{width:100%}.filters{display:grid;grid-template-columns:1fr 135px;gap:9px;margin-bottom:10px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{font-size:13px;padding:9px 11px;background:#15233a}.chip.active{background:#2764ac}.item{padding:15px;margin:9px 0;border:1px solid #283d5a;background:#101c2f;border-radius:13px}.itemtop,.details{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.name{font-size:18px;font-weight:700}.code{color:#9badc6;font-size:13px}.price{font-size:19px;font-weight:700;text-align:right}.rise{color:#f58d8d}.fall{color:#71caa6}.tag{display:inline-block;border-radius:6px;padding:4px 7px;background:#203756;color:#dbe8ff;font-size:12px}.tag.hot{background:#653c39;color:#ffe4ce}.details{margin-top:13px;font-size:13px;color:#b6c6db;flex-wrap:wrap}.details span{display:block}progress{width:100%;height:7px;accent-color:#62b6ed;margin-top:9px}.empty{padding:30px;text-align:center;line-height:1.8;background:#111d31;border-radius:13px}.foot{color:#8fa4bc;font-size:12px;line-height:1.7;margin-top:16px}.status{margin:12px 0;font-size:13px}.watch{border:none;background:transparent;padding:0;color:#f5cf6d;font-size:21px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.subbtn{font-size:13px;padding:7px 10px}.warn{color:#ffc684}.stocklink{color:inherit;text-decoration:none;display:inline-block;padding:4px 0}.stocklink:focus-visible{outline:2px solid #62b6ed;border-radius:4px}.stocklink:active{opacity:.7}
</style></head><body><header><div class="wrap"><h1>◈ 台股短線雷達</h1><div class="subtitle">你的私人選股系統 · 上市＋上櫃 · 官方收盤資料</div></div></header><main class="wrap"><section class="stats"><div class="stat"><span>資料涵蓋股票</span><strong id="total">—</strong></div><div class="stat"><span>候選觀察</span><strong id="candidates">—</strong></div><div class="stat"><span>資料最新日期</span><strong style="font-size:15px" id="date">—</strong></div></section><div class="status" id="status">正在讀取行情資料…</div><div class="filters"><input id="search" placeholder="搜尋股票代碼、公司名稱"><select id="market"><option value="all">全部市場</option><option value="上市">上市</option><option value="上櫃">上櫃</option></select></div><div class="chips"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="候選觀察">候選觀察</button><button class="chip" data-filter="過熱勿追">過熱勿追</button><button class="chip" data-filter="watch">我的追蹤</button></div><div class="row"><span class="muted" id="count"></span><button id="reload" class="subbtn">重新整理</button></div><div id="list"></div><p class="foot">本頁僅為條件篩選與學習工具，不是自動交易。來源：臺灣證券交易所、證券櫃檯買賣中心官方每日收盤資料。不是盤中即時行情；資料若不足60個交易日，技術評分暫停。停損／停利為機械化參考值，並非保證價格。注意除權息、減資、停牌等事件可能扭曲未還原資料；正式交易前請再向券商核對。</p></main><script>
const $=x=>document.getElementById(x);let all=[],filter='all',favorites=new Set(JSON.parse(localStorage.getItem('tw-radar-watch')||'[]'));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const display=n=>n==null?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});
function render(){let q=$('search').value.trim(),m=$('market').value;let x=all.filter(s=>(!q||(s.name.includes(q)||s.id.includes(q)))&&(m==='all'||s.market===m)&&(filter==='all'||(filter==='watch'?favorites.has(s.market+':'+s.id):s.status===filter)));$('count').textContent=`顯示 ${x.length} 檔 · 分數依條件計算，非成功機率`;$('list').innerHTML=x.length?x.slice(0,300).map(s=>{const key=s.market+':'+s.id,chg=s.changePct;return `<article class="item"><div class="itemtop"><div><div class="name"><a class="stocklink" href="stock.html?stock=${encodeURIComponent(s.id)}">${esc(s.name)} <small class="code">${esc(s.id)}</small> ›</a></div><div class="code">${esc(s.market)} · ${esc(s.date)} · <span class="tag ${s.status==='過熱勿追'?'hot':''}">${esc(s.status)}</span></div></div><div><div class="price">${display(s.close)}</div><div class="code ${chg==null?'':chg>=0?'rise':'fall'}" style="text-align:right">${chg==null?'—':(chg>0?'+':'')+display(chg)+'%'}</div></div></div><progress value="${s.score||0}" max="100"></progress><div class="details"><div><span>條件評分</span><b>${s.score??'未建立'}${s.score==null?'':' / 100'}</b></div><div><span>量比</span><b>${display(s.volumeRatio)}</b></div><div><span>MA20 / MA60</span><b>${display(s.ma20)} / ${display(s.ma60)}</b></div><div><span>RSI</span><b>${display(s.rsi14)}</b></div></div><div class="details"><div><span>停損參考</span><b>${display(s.stopReference)}</b></div><div><span>2R 目標</span><b>${display(s.target2R)}</b></div><div><span>歷史天數</span><b>${s.bars} / 60</b></div><button class="watch" data-watch="${esc(key)}" title="加入追蹤">${favorites.has(key)?'★':'☆'}</button></div></article>`}).join(''):'<div class="empty">目前沒有符合條件的股票。若是剛部署，系統正在累積歷史交易日，請確認資料更新日期。</div>';$('list').querySelectorAll('[data-watch]').forEach(b=>b.addEventListener('click',()=>{let k=b.dataset.watch;favorites.has(k)?favorites.delete(k):favorites.add(k);localStorage.setItem('tw-radar-watch',JSON.stringify([...favorites]));render()}));}
async function load(){try{let res=await fetch('data/latest.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('伺服器沒有提供資料');let d=await res.json();all=d.stocks||[];$('total').textContent=all.length.toLocaleString();$('candidates').textContent=all.filter(x=>x.status==='候選觀察').length;let dates=Object.values(d.coverage||{}).map(x=>x.date);$('date').textContent=dates.length?dates.sort().at(-1):'尚未更新';let issues=Object.entries(d.errors||{}).map(([k,v])=>k+': '+v).join('；');$('status').innerHTML=d.generatedAt?`最近更新：${esc(d.generatedAt.replace('T',' ').slice(0,19))}（台灣時間）${issues?'<br><span class="warn">部分來源異常：'+esc(issues)+'</span>':''}`:'<span class="warn">尚未執行第一次雲端資料更新，請先啟用 GitHub Actions。</span>';render()}catch(e){$('status').textContent='讀取失敗：'+e.message;}}
$('search').oninput=render;$('market').onchange=render;$('reload').onclick=load;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});load();
</script></body></html>
