
name: Test iPhone Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret is missing"
            exit 1
          fi
          curl --fail --show-error --silent \
            --retry 2 \
            -H "Title: Taiwan Stock Radar Test" \
            -H "Priority: 4" \
            -d "台股短線雷達：手機通知測試成功！" \
            "https://ntfy.sh/${NTFY_TOPIC}"
